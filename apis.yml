name: Immigram LTD
description: >-
  Immigram is a UK relocation and immigration platform that helps IT specialists,
  engineers, founders, and entrepreneurs move to the United Kingdom, primarily via
  the Global Talent Visa (Tech Nation endorsement route) as well as Skilled Worker,
  settlement (ILR/naturalization), family, US O-1, and Spanish Startup visa paths.
  The company pairs immigration legal expertise with an AI-assisted platform that
  scores eligibility in advance, collects and reviews applicant data into a case,
  and tracks the process through a live dashboard with data-driven guidance and
  support. Founded in 2019 and backed by the 500 Global accelerator, Immigram is
  a services/SaaS provider and does not publish a public developer API.
